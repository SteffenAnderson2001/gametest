
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07132e">
<title>Coolbet Gift Catch</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#fff;background:#071421}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{display:flex;justify-content:center;align-items:center;background:radial-gradient(ellipse at 50% 40%,#21475a 0%,#071421 72%)}
main{position:relative;width:min(100vw,calc(94dvh * 600 / 830),700px);height:min(100dvh,94dvh);max-height:100dvh;overflow:hidden;isolation:isolate}
.game{position:absolute;inset:0;overflow:hidden;background:#0b304b;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.brand{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:22px 24px 46px;background:linear-gradient(180deg,#06172bd9 0%,#06172b88 55%,transparent 100%);pointer-events:none}
.brand .logo{font-weight:950;letter-spacing:.15em;font-size:18px;color:#d7fff0}
.brand .logo i{font-style:normal;color:#77e1bd}
.brand .tag{display:block;font-size:10px;letter-spacing:.18em;color:#b5d4db;margin-top:3px;font-weight:700}
.pill{pointer-events:auto;display:grid;place-items:center;width:39px;height:39px;border:1px solid #ffffff35;border-radius:50%;background:#102b40a0;color:white;font-size:16px;cursor:pointer;backdrop-filter:blur(10px)}
.stats{position:absolute;top:91px;left:20px;right:20px;z-index:3;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.stat{display:flex;align-items:center;gap:7px;text-shadow:0 2px 8px #0017}
.stat small{font-size:10px;letter-spacing:.14em;font-weight:800;color:#c1d9dd}
.stat strong{font-size:21px;letter-spacing:-.04em;font-weight:850;font-variant-numeric:tabular-nums}
.stat:last-child strong{font-size:19px;letter-spacing:0}
.stat:nth-child(2){display:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(180deg,#06172b60,#06172bb3);backdrop-filter:blur(5px);z-index:5}
.overlay.hidden{display:none}
.modal{width:min(100%,350px);text-align:center;padding:22px 12px;background:transparent;border:0;box-shadow:none}
.modal .emoji{font-size:58px;filter:drop-shadow(0 5px 20px #0007)}
.modal h1{font-size:clamp(35px,8vw,52px);line-height:1.04;letter-spacing:-.065em;margin:18px 0 12px;font-weight:950;text-shadow:0 4px 24px #001a}
.modal p{font-size:15px;line-height:1.6;color:#e0eff2;margin:0 auto 25px;max-width:300px;text-shadow:0 2px 10px #001b}
.primary{min-width:200px;padding:16px 28px;border:0;border-radius:100px;background:#80edbc;color:#082e2d;font-weight:900;font-size:15px;letter-spacing:.03em;cursor:pointer;box-shadow:0 8px 32px #0019}
.primary:active{transform:scale(.98)}
.footer{display:none}
button:focus-visible{outline:2px solid #91f0c8;outline-offset:3px}
@media(max-width:650px){
body{background:#071421}
main{width:100vw;height:100dvh}
.brand{padding:calc(15px + env(safe-area-inset-top)) 18px 42px}
.stats{top:calc(80px + env(safe-area-inset-top));left:18px;right:18px}
.modal h1{font-size:40px}
}
</style>
</head>
<body>
<main>
<div class="game">
<canvas id="canvas" width="600" height="830" aria-label="Gift Catch game area"></canvas>
<div class="overlay" id="overlay">
<div class="modal">
<div class="emoji" id="modalEmoji">🎁</div>
<h1 id="modalTitle">GIFT CATCH</h1>
<p id="modalText">Catch the Christmas presents, grab golden gifts for extra points and avoid the hazards. You have three lives.</p>
<button class="primary" id="start">PLAY NOW</button>
</div>
</div>
</div>
<div class="brand">
<div>
<div class="logo">COOL<i>BET</i></div>
<span class="tag">WINTER ARCADE</span>
</div>
<button class="pill" id="pause" aria-label="Pause game">Ⅱ</button>
</div>
<div class="stats">
<div class="stat"><small>SCORE</small><strong id="score">0</strong></div>
<div class="stat"><small>BEST</small><strong id="best">0</strong></div>
<div class="stat"><strong id="lives">❤️❤️❤️</strong></div>
</div>
</main>
<script>
(()=>{
'use strict';

const c=document.getElementById('canvas');
const ctx=c.getContext('2d');
const W=600,H=830;
const el=id=>document.getElementById(id);

const bear=new Image();
bear.src='coolbet-bear.png';

const stars=Array.from({length:64},(_,i)=>({
x:(i*139+37)%W,
y:(i*263+41)%H,
r:(i%3+1)*.65
}));

const snow=Array.from({length:95},()=>({
x:Math.random()*W,
y:Math.random()*H,
r:randSnow(0.7,2.7),
speed:randSnow(12,52),
drift:randSnow(-9,9),
phase:Math.random()*6.28
}));

function randSnow(a,b){return a+Math.random()*(b-a)}

let snowTime=0;
let state='ready',score=0,lives=3,combo=0,best=0;
let elapsed=0,spawn=0,objects=[],particles=[];
let playerX=300,dir=0,pointer=false,invincible=0,last=0,raf=0;

try{
best=Number(localStorage.getItem('coolbet-gift-catch-best')||0);
}catch{}

el('best').textContent=best;

const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function ui(){
el('score').textContent=score;
el('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);
el('best').textContent=best;
}

function show(emoji,title,text,button){
el('modalEmoji').textContent=emoji;
el('modalTitle').textContent=title;
el('modalText').textContent=text;
el('start').textContent=button;
el('overlay').classList.remove('hidden');
}

function hide(){
el('overlay').classList.add('hidden');
}

function begin(){
score=0;
lives=3;
combo=0;
elapsed=0;
spawn=.5;
objects=[];
particles=[];
playerX=300;
invincible=0;
state='playing';
el('pause').textContent='Ⅱ';
hide();
ui();
}

function end(){
state='over';
if(score>best){
best=score;
try{
localStorage.setItem('coolbet-gift-catch-best',String(best));
}catch{}
}
ui();
show(
'🏆',
'GAME OVER',
`You scored ${score.toLocaleString()} points. ${score===best?'That is your best score!':'Best score: '+best.toLocaleString()+'.'} Try again and beat your record!`,
'PLAY AGAIN'
);
}

function burst(x,y,color,n=12){
for(let i=0;i<n;i++){
let a=Math.random()*Math.PI*2,s=rand(65,240);
particles.push({
x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
life:rand(.3,.7),max:.7,color
});
}
}

function spawnOne(){
const r=Math.random();
const type=r<.66?'gift':r<.82?'gold':r<.92?'bomb':'ice';
const x=rand(45,W-45);
objects.push({
x,y:-45,type,
vy:rand(190,265)+Math.min(elapsed*6,220),
rot:rand(-.2,.2),
size:type==='gold'?34:31,
phase:rand(0,6.28)
});
}

function update(dt){
elapsed+=dt;
invincible=Math.max(0,invincible-dt);
playerX=clamp(playerX+dir*480*dt,76,W-76);
spawn-=dt;

if(spawn<=0){
spawnOne();
spawn=rand(.43,.72)*Math.max(.58,1-elapsed/220);
}

for(let i=objects.length-1;i>=0;i--){
const o=objects[i];
o.y+=o.vy*dt;
o.rot+=Math.sin(elapsed*2+o.phase)*.002;

const headY=H-29-142;
const hit=Math.abs(o.y-headY)<33&&Math.abs(o.x-playerX)<43;

if(hit){
objects.splice(i,1);
if(o.type==='gift'||o.type==='gold'){
combo++;
let points=o.type==='gold'?50:10;
if(combo%5===0)points+=50;
score+=points;
burst(o.x,o.y,o.type==='gold'?'#ffd36a':'#8dffca',15);
if(score>best){
best=score;
try{
localStorage.setItem('coolbet-gift-catch-best',String(best));
}catch{}
}
ui();
}else if(invincible<=0){
lives--;
combo=0;
invincible=1.1;
burst(o.x,o.y,'#ff748d',22);
ui();
if(lives<=0){
end();
return;
}
}
}else if(o.y>H-15){
objects.splice(i,1);
if(o.type==='gift'||o.type==='gold')combo=0;
}
}

for(let i=particles.length-1;i>=0;i--){
let p=particles[i];
p.x+=p.vx*dt;
p.y+=p.vy*dt;
p.vy+=300*dt;
p.life-=dt;
if(p.life<=0)particles.splice(i,1);
}
}

function rounded(x,y,w,h,r,fill){
ctx.fillStyle=fill;
ctx.beginPath();
ctx.roundRect(x,y,w,h,r);
ctx.fill();
}

function polygon(pts,color){
ctx.fillStyle=color;
ctx.beginPath();
ctx.moveTo(pts[0][0],pts[0][1]);
for(const q of pts.slice(1))ctx.lineTo(q[0],q[1]);
ctx.closePath();
ctx.fill();
}

function tree(x,y,h,shade){
ctx.fillStyle='#112e42';
ctx.fillRect(x-7,y-h*.16,14,h*.2);
for(let i=0;i<3;i++){
let yy=y-h*.86+i*h*.21,ww=h*(.21+i*.07);
polygon([[x,yy-h*.25],[x-ww,yy+h*.17],[x+ww,yy+h*.17]],shade);
ctx.strokeStyle='#d4f5f7';
ctx.lineWidth=4;
ctx.lineCap='round';
ctx.beginPath();
ctx.moveTo(x-ww*.62,yy+h*.10);
ctx.quadraticCurveTo(x,yy+h*.16,x+ww*.62,yy+h*.10);
ctx.stroke();
}
}

function gift(o){
let gold=o.type==='gold',bad=o.type==='bomb',ice=o.type==='ice';
ctx.save();
ctx.translate(o.x,o.y);
ctx.rotate(o.rot);
ctx.shadowBlur=18;
ctx.shadowColor=gold?'#ffe0a0':bad?'#ff5b6b':'#b6ecff';

if(ice){
rounded(-26,-26,52,52,12,'#81d5f2');
rounded(-21,-21,42,42,9,'#bcefff');
ctx.strokeStyle='#ffffffc9';
ctx.lineWidth=3;
ctx.beginPath();
ctx.moveTo(-11,-9);
ctx.lineTo(3,5);
ctx.lineTo(-5,15);
ctx.moveTo(3,5);
ctx.lineTo(15,-7);
ctx.stroke();
}else if(bad){
ctx.fillStyle='#273448';
ctx.beginPath();
ctx.arc(0,3,24,0,Math.PI*2);
ctx.fill();
ctx.strokeStyle='#ff8892';
ctx.lineWidth=4;
ctx.beginPath();
ctx.arc(0,3,19,.5,2.8);
ctx.stroke();
ctx.strokeStyle='#e6c48e';
ctx.lineWidth=5;
ctx.beginPath();
ctx.moveTo(9,-18);
ctx.lineTo(15,-31);
ctx.stroke();
ctx.fillStyle='#ffd879';
ctx.beginPath();
ctx.arc(16,-33,5,0,7);
ctx.fill();
}else{
rounded(-27,-20,54,49,8,gold?'#f3b842':'#ed5d73');
rounded(-31,-25,62,15,5,gold?'#ffe18a':'#ff8796');
rounded(-6,-25,12,54,2,gold?'#fff2c2':'#ffe7b2');
rounded(-31,-18,62,8,1,gold?'#fff2c2':'#ffe7b2');
ctx.strokeStyle=gold?'#fff1b8':'#ffcf92';
ctx.lineWidth=6;
ctx.beginPath();
ctx.ellipse(-9,-30,11,6,-.5,0,Math.PI*2);
ctx.ellipse(9,-30,11,6,.5,0,Math.PI*2);
ctx.stroke();
}
ctx.restore();
}

function draw(){
const sky=ctx.createLinearGradient(0,0,0,H);
sky.addColorStop(0,'#071e40');
sky.addColorStop(.50,'#195477');
sky.addColorStop(1,'#87bdc5');
ctx.fillStyle=sky;
ctx.fillRect(0,0,W,H);

const glow=ctx.createRadialGradient(470,155,0,470,155,280);
glow.addColorStop(0,'#d6f4f454');
glow.addColorStop(1,'#d6f4f400');
ctx.fillStyle=glow;
ctx.fillRect(0,0,W,H);

ctx.fillStyle='#e9fcf1';
ctx.shadowColor='#c9ffff';
ctx.shadowBlur=28;
ctx.beginPath();
ctx.arc(462,126,41,0,Math.PI*2);
ctx.fill();
ctx.shadowBlur=0;

for(const s of stars){
ctx.globalAlpha=.35+.3*Math.sin(s.x+snowTime);
ctx.fillStyle='#d7fcff';
ctx.beginPath();
ctx.arc(s.x,s.y*.78,s.r,0,Math.PI*2);
ctx.fill();
}
ctx.globalAlpha=1;

polygon([[0,575],[90,423],[170,512],[285,360],[411,520],[510,395],[600,518],[600,830],[0,830]],'#43758d');
polygon([[0,612],[90,470],[170,555],[285,404],[411,559],[510,442],[600,554],[600,830],[0,830]],'#6d9fae');
polygon([[234,430],[285,360],[345,442],[310,427],[286,399],[267,427]],'#e4f5f3');
polygon([[460,464],[510,395],[566,473],[530,451],[510,427],[490,454]],'#e4f5f3');

ctx.fillStyle='#d2eff1';
ctx.beginPath();
ctx.moveTo(0,675);
ctx.quadraticCurveTo(170,598,340,667);
ctx.quadraticCurveTo(480,700,600,622);
ctx.lineTo(600,H);
ctx.lineTo(0,H);
ctx.fill();

for(let i=0;i<8;i++){
let x=i*91-28,y=693+(i%3)*16;
tree(x,y,110+(i%3)*23,i%2?'#164e56':'#1d6267');
}

ctx.fillStyle='#f2fcfa';
ctx.beginPath();
ctx.moveTo(0,744);
ctx.quadraticCurveTo(150,711,300,742);
ctx.quadraticCurveTo(450,765,600,731);
ctx.lineTo(600,H);
ctx.lineTo(0,H);
ctx.fill();
ctx.strokeStyle='#b4e3e6';
ctx.lineWidth=3;
ctx.beginPath();
ctx.moveTo(0,744);
ctx.quadraticCurveTo(150,711,300,742);
ctx.quadraticCurveTo(450,765,600,731);
ctx.stroke();

for(const f of snow){
let sy=(f.y+snowTime*f.speed)%H;
let sx=(f.x+Math.sin(snowTime*.7+f.phase)*12+snowTime*f.drift%W+W)%W;
ctx.globalAlpha=f.r>1.7?.8:.48;
ctx.fillStyle='#fff';
ctx.beginPath();
ctx.arc(sx,sy,f.r,0,Math.PI*2);
ctx.fill();
}
ctx.globalAlpha=1;

for(const o of objects)gift(o);

ctx.save();
ctx.translate(playerX,H-29);
if(invincible>0&&Math.floor(invincible*10)%2===0)ctx.globalAlpha=.4;
ctx.fillStyle='#345e6580';
ctx.beginPath();
ctx.ellipse(0,0,45,9,0,0,Math.PI*2);
ctx.fill();

if(bear.complete&&bear.naturalWidth){
ctx.drawImage(bear,-48,-144,96,144);
}else{
ctx.font='85px system-ui';
ctx.textAlign='center';
ctx.fillText('🐻‍❄️',0,-35);
}
ctx.restore();

if(combo>=2){
rounded(18,63,164,39,12,'#0a4055dc');
ctx.font='bold 18px system-ui';
ctx.textAlign='left';
ctx.fillStyle='#baffdb';
ctx.fillText(`COMBO ×${combo}`,31,89);
}

for(const p of particles){
ctx.globalAlpha=clamp(p.life/p.max,0,1);
ctx.fillStyle=p.color;
ctx.beginPath();
ctx.arc(p.x,p.y,3,0,Math.PI*2);
ctx.fill();
}
ctx.globalAlpha=1;
}

function loop(t){
if(!last)last=t;
let dt=Math.min((t-last)/1000,.035);
last=t;
snowTime+=dt;
if(state==='playing')update(dt);
draw();
raf=requestAnimationFrame(loop);
}

el('start').addEventListener('click',()=>{
if(state==='paused'){
state='playing';
hide();
el('pause').textContent='Ⅱ';
}else begin();
});

el('pause').addEventListener('click',()=>{
if(state==='playing'){
state='paused';
show('⏸️','PAUSED','Your game is paused. Continue when you are ready.','RESUME');
el('pause').textContent='▶';
}else if(state==='paused'){
state='playing';
hide();
el('pause').textContent='Ⅱ';
}
});

function pos(e){
const r=c.getBoundingClientRect();
playerX=clamp((e.clientX-r.left)/r.width*W,62,W-62);
}

c.addEventListener('pointerdown',e=>{
e.preventDefault();
pointer=true;
c.setPointerCapture(e.pointerId);
if(state==='playing')pos(e);
});

c.addEventListener('pointermove',e=>{
if(pointer){
e.preventDefault();
if(state==='playing')pos(e);
}
});

c.addEventListener('pointerup',()=>pointer=false);
c.addEventListener('pointercancel',()=>pointer=false);

window.addEventListener('keydown',e=>{
if(e.key==='ArrowLeft'||e.key==='a'){
dir=-1;
e.preventDefault();
}
if(e.key==='ArrowRight'||e.key==='d'){
dir=1;
e.preventDefault();
}
if(e.key===' '&&state==='ready'){
begin();
e.preventDefault();
}
});

window.addEventListener('keyup',e=>{
if(['ArrowLeft','ArrowRight','a','d'].includes(e.key))dir=0;
});

document.addEventListener('visibilitychange',()=>{
if(document.hidden&&state==='playing'){
state='paused';
show('⏸️','PAUSED','Your game was paused while you were away.','RESUME');
}
});

requestAnimationFrame(loop);
})();
</script>
</body>
</html>
